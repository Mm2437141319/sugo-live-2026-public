<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">

<title>Pet Water Record</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f7f8fa;
  color:#333;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans TC",
    "Microsoft JhengHei",
    sans-serif;
}

.container{
  width:100%;
  max-width:720px;
  margin:0 auto;
  padding:18px 14px 45px;
}

.card{
  background:#ffffff;
  border-radius:22px;
  padding:20px;
  margin-bottom:14px;
  box-shadow:0 4px 18px rgba(0,0,0,.06);
}

h1{
  margin:0;
  font-size:28px;
  line-height:1.3;
  font-weight:850;
}

.sub{
  margin-top:7px;
  color:#888;
  font-size:15px;
}

.pet{
  margin-top:15px;
}

.pet input,
.field input,
.field select,
.filter select{
  width:100%;
  height:48px;
  border:1px solid #ddd;
  border-radius:13px;
  background:#fff;
  padding:0 13px;
  font-size:16px;
  outline:none;
}

.pet input:focus,
.field input:focus,
.field select:focus,
.filter select:focus{
  border-color:#999;
}

.field input[readonly]{
  background:#f7f7f7;
  color:#555;
}

.title{
  font-size:20px;
  font-weight:800;
  margin-bottom:15px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:11px;
}

.field label{
  display:block;
  color:#777;
  font-size:14px;
  margin-bottom:6px;
}

.add,
.save{
  width:100%;
  height:50px;
  border:0;
  border-radius:14px;
  background:#333;
  color:#fff;
  font-size:17px;
  font-weight:750;
  margin-top:14px;
  cursor:pointer;
}

.add:active,
.save:active,
.today:active,
.cancel:active,
.clear:active,
.actions button:active{
  transform:scale(.98);
}

.cancel{
  width:100%;
  height:44px;
  border:1px solid #ddd;
  border-radius:13px;
  background:#fff;
  color:#666;
  font-size:15px;
  margin-top:8px;
  cursor:pointer;
}

.editing{
  background:#fff9e8;
  border:1px solid #f0d98c;
}

.editing .title{
  color:#8a6810;
}

.today{
  width:100%;
  height:44px;
  border:1px solid #ddd;
  border-radius:13px;
  background:#fff;
  color:#555;
  font-size:15px;
  margin-top:11px;
  cursor:pointer;
}

.filter{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.filter label{
  display:block;
  margin-bottom:5px;
  color:#777;
  font-size:13px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}

.stat{
  background:#fafafa;
  border-radius:15px;
  text-align:center;
  padding:13px 5px;
}

.num{
  font-size:21px;
  font-weight:850;
}

.lab{
  margin-top:3px;
  color:#888;
  font-size:12px;
}

.record{
  padding:15px 0;
  border-bottom:1px solid #eee;
}

.record:last-child{
  border-bottom:0;
}

.recordTop{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
}

.date{
  font-size:19px;
  font-weight:750;
}

.year{
  margin-top:3px;
  color:#999;
  font-size:13px;
}

.time{
  margin-top:4px;
  color:#888;
  font-size:13px;
}

.cc{
  font-size:23px;
  font-weight:850;
  white-space:nowrap;
}

.cc small{
  color:#777;
  font-size:13px;
  font-weight:500;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:9px;
}

.actions button{
  border:0;
  border-radius:9px;
  padding:8px 13px;
  font-size:13px;
  cursor:pointer;
}

.view{
  background:#f0f0f0;
  color:#555;
}

.edit{
  background:#eeeeee;
}

.del{
  background:#ffe8e8;
  color:#a33;
}

.empty{
  padding:30px 8px;
  text-align:center;
  color:#aaa;
}

.monthTotal{
  background:#f7f7f7;
  border-radius:14px;
  padding:12px 14px;
  margin-bottom:4px;
  font-weight:700;
}

.clear{
  width:100%;
  height:44px;
  border:1px solid #ddd;
  border-radius:12px;
  background:#fff;
  color:#888;
  margin-top:12px;
  cursor:pointer;
}

.note{
  margin-top:10px;
  color:#999;
  font-size:12px;
  line-height:1.6;
}

.autoSave{
  margin-top:8px;
  text-align:center;
  color:#777;
  font-size:12px;
}

@media(max-width:480px){

  .grid,
  .filter{
    grid-template-columns:1fr;
  }

  h1{
    font-size:25px;
  }

  .recordTop{
    align-items:flex-start;
  }

}

</style>
</head>

<body>

<div class="container">


<!-- =====================================================
     PET HEADER
===================================================== -->

<div class="card">

  <h1>
    🐾 <span id="titlePetName">寵物</span> 喝水紀錄
  </h1>

  <div class="sub">
    記錄每天喝水量 💧
  </div>

  <div class="pet">

    <input
      id="petName"
      type="text"
      placeholder="請輸入寵物名字（例如 Lucky）"
      autocomplete="off"
    >

    <div class="autoSave">
      💾 寵物名字可以自行修改，輸入後自動保存
    </div>

  </div>

</div>


<!-- =====================================================
     ADD / EDIT FORM
===================================================== -->

<div
  class="card"
  id="formCard"
>

  <div
    class="title"
    id="formTitle"
  >
    💧 新增喝水紀錄
  </div>


  <!-- YEAR / DATE -->

  <div class="grid">

    <div class="field">

      <label>
        年份（民國）
      </label>

      <select id="year">

        <option value="">
          請選擇
        </option>

      </select>

    </div>


    <div class="field">

      <label>
        日期（月／日）
      </label>

      <input
        id="date"
        type="text"
        inputmode="numeric"
        placeholder="例如 09/09"
        maxlength="5"
      >

    </div>

  </div>


  <!-- WEEKDAY / TIME -->

  <div
    class="grid"
    style="margin-top:11px"
  >

    <div class="field">

      <label>
        星期
      </label>

      <input
        id="weekday"
        type="text"
        readonly
        placeholder="自動帶入"
      >

    </div>


    <div class="field">

      <label>
        時間
      </label>

      <input
        id="recordTime"
        type="time"
        step="60"
      >

    </div>

  </div>


  <!-- CURRENT TIME BUTTON -->

  <button
    class="today"
    id="todayButton"
    type="button"
  >
    📅 自動帶入現在年月日・星期・時間
  </button>


  <!-- WATER AMOUNT -->

  <div
    class="field"
    style="margin-top:11px"
  >

    <label>
      喝水量 CC（可選填）
    </label>

    <input
      id="cc"
      type="number"
      min="0"
      step="1"
      inputmode="numeric"
      placeholder="例如 230"
    >

  </div>


  <!-- MAIN BUTTON -->

  <button
    class="add"
    id="mainButton"
    type="button"
  >
    ＋ 新增紀錄
  </button>


  <!-- CANCEL EDIT -->

  <button
    class="cancel"
    id="cancelButton"
    type="button"
    style="display:none"
  >
    取消編輯
  </button>


  <div class="note">

    年份、日期、CC 數可以留白。<br>

    新增時可以自動帶入現在的民國年月日、星期與時間。<br>

    編輯後按「儲存修改」會直接覆蓋原本紀錄。<br>

    同一年＋同一天再次輸入時，會自動偵測是否已有紀錄。

  </div>

</div>


<!-- =====================================================
     FILTER
===================================================== -->

<div class="card">

  <div class="title">
    📅 查看紀錄
  </div>


  <div class="filter">

    <div>

      <label>
        年份
      </label>

      <select id="filterYear">

        <option value="all">
          全部年份
        </option>

      </select>

    </div>


    <div>

      <label>
        月份
      </label>

      <select id="filterMonth">

        <option value="all">
          全部月份
        </option>

      </select>

    </div>

  </div>

</div>


<!-- =====================================================
     STATISTICS
===================================================== -->

<div class="card">

  <div class="title">
    📊 統計
  </div>


  <div class="stats">


    <div class="stat">

      <div
        class="num"
        id="totalCC"
      >
        0
      </div>

      <div class="lab">
        總 CC
      </div>

    </div>


    <div class="stat">

      <div
        class="num"
        id="count"
      >
        0
      </div>

      <div class="lab">
        紀錄筆數
      </div>

    </div>


    <div class="stat">

      <div
        class="num"
        id="avg"
      >
        0
      </div>

      <div class="lab">
        平均 CC
      </div>

    </div>


  </div>

</div>


<!-- =====================================================
     RECORD LIST
===================================================== -->

<div class="card">

  <div class="title">
    📋 喝水紀錄
  </div>


  <div id="monthTotal"></div>


  <div id="records"></div>


  <button
    class="clear"
    id="clearButton"
    type="button"
  >
    清除全部紀錄
  </button>

</div>


</div>


<script>


/* =========================================================
   STORAGE
   Keep original storage keys.
========================================================= */

const STORAGE_KEY =
  "petWaterRecordsV2";

const PET_KEY =
  "petWaterPetNameV2";


/* =========================================================
   DATA
========================================================= */

let records = [];

let editingId = null;


/* =========================================================
   LOAD DATA
========================================================= */

try{

  const saved =
    localStorage.getItem(
      STORAGE_KEY
    );

  records =
    saved
      ? JSON.parse(saved)
      : [];

  if(!Array.isArray(records)){

    records=[];

  }

}catch(error){

  console.error(
    "Unable to load records:",
    error
  );

  records=[];

}


/* =========================================================
   DOM REFERENCES
========================================================= */

const petName =
  document.getElementById(
    "petName"
  );

const titlePetName =
  document.getElementById(
    "titlePetName"
  );

const year =
  document.getElementById(
    "year"
  );

const dateInput =
  document.getElementById(
    "date"
  );

const weekdayInput =
  document.getElementById(
    "weekday"
  );

const recordTime =
  document.getElementById(
    "recordTime"
  );

const ccInput =
  document.getElementById(
    "cc"
  );

const filterYear =
  document.getElementById(
    "filterYear"
  );

const filterMonth =
  document.getElementById(
    "filterMonth"
  );

const formCard =
  document.getElementById(
    "formCard"
  );

const formTitle =
  document.getElementById(
    "formTitle"
  );

const mainButton =
  document.getElementById(
    "mainButton"
  );

const cancelButton =
  document.getElementById(
    "cancelButton"
  );

const todayButton =
  document.getElementById(
    "todayButton"
  );

const clearButton =
  document.getElementById(
    "clearButton"
  );


/* =========================================================
   YEAR OPTIONS
   ROC YEAR 100 - 130
========================================================= */

for(
  let y=100;
  y<=130;
  y++
){

  const option =
    document.createElement(
      "option"
    );

  option.value =
    String(y);

  option.textContent =
    y+" 年";

  year.appendChild(
    option
  );


  const filterOption =
    document.createElement(
      "option"
    );

  filterOption.value =
    String(y);

  filterOption.textContent =
    y+" 年";

  filterYear.appendChild(
    filterOption
  );

}


/* =========================================================
   MONTH OPTIONS
   01 - 12
========================================================= */

for(
  let m=1;
  m<=12;
  m++
){

  const mm =
    String(m)
      .padStart(2,"0");

  const option =
    document.createElement(
      "option"
    );

  option.value =
    mm;

  option.textContent =
    mm+" 月";

  filterMonth.appendChild(
    option
  );

}


/* =========================================================
   PET NAME
========================================================= */

petName.value =
  localStorage.getItem(
    PET_KEY
  ) || "";


function updatePetName(){

  const name =
    petName.value.trim();

  titlePetName.textContent =
    name || "寵物";

}


updatePetName();


petName.addEventListener(
  "input",
  function(){

    localStorage.setItem(
      PET_KEY,
      petName.value
    );

    updatePetName();

  }
);


/* =========================================================
   SAVE
========================================================= */

function save(){

  try{

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(records)
    );

  }catch(error){

    console.error(
      "Unable to save:",
      error
    );

    alert(
      "資料保存失敗，請確認瀏覽器儲存空間。"
    );

  }

}


/* =========================================================
   WEEKDAYS
========================================================= */

const WEEKDAYS = [

  "星期日",
  "星期一",
  "星期二",
  "星期三",
  "星期四",
  "星期五",
  "星期六"

];


/* =========================================================
   GET CURRENT DATE / TIME
========================================================= */

function getNowData(){

  const now =
    new Date();


  const rocYear =
    now.getFullYear()-1911;


  const month =
    String(
      now.getMonth()+1
    ).padStart(
      2,
      "0"
    );


  const day =
    String(
      now.getDate()
    ).padStart(
      2,
      "0"
    );


  const hours =
    String(
      now.getHours()
    ).padStart(
      2,
      "0"
    );


  const minutes =
    String(
      now.getMinutes()
    ).padStart(
      2,
      "0"
    );


  return{

    year:
      String(rocYear),

    date:
      month+
      "/"+
      day,

    weekday:
      WEEKDAYS[
        now.getDay()
      ],

    time:
      hours+
      ":"+
      minutes

  };

}


/* =========================================================
   FILL CURRENT DATE / TIME
========================================================= */

function fillNow(){

  const data =
    getNowData();


  if(
    Number(data.year)>=100 &&
    Number(data.year)<=130
  ){

    year.value =
      data.year;

  }


  dateInput.value =
    data.date;


  weekdayInput.value =
    data.weekday;


  recordTime.value =
    data.time;

}


/* =========================================================
   CALCULATE WEEKDAY
========================================================= */

function calculateWeekday(
  yearValue,
  dateValue
){

  if(
    !yearValue ||
    !dateValue
  ){

    return "";

  }


  const match =
    String(dateValue).match(
      /^(0[1-9]|1[0-2])\/(0[1-9]|[12]\d|3[01])$/
    );


  if(!match){

    return "";

  }


  const westernYear =
    Number(yearValue)+1911;


  const month =
    Number(match[1]);


  const day =
    Number(match[2]);


  const date =
    new Date(
      westernYear,
      month-1,
      day
    );


  if(
    date.getFullYear()!==westernYear ||
    date.getMonth()!==month-1 ||
    date.getDate()!==day
  ){

    return "";

  }


  return WEEKDAYS[
    date.getDay()
  ];

}


/* =========================================================
   TODAY BUTTON
========================================================= */

todayButton.addEventListener(
  "click",
  function(){

    fillNow();

  }
);


/* =========================================================
   NORMALIZE DATE
========================================================= */

function normalizeDate(value){

  let v =
    String(
      value || ""
    )
    .trim()
    .replace(
      /[^\d]/g,
      ""
    );


  if(v===""){

    return "";

  }


  if(v.length===3){

    v=
      "0"+v;

  }


  if(v.length===4){

    return(
      v.slice(0,2)+
      "/"+
      v.slice(2,4)
    );

  }


  return null;

}


/* =========================================================
   VALIDATE DATE
========================================================= */

function validDate(value){

  if(value===""){

    return true;

  }


  const match =
    value.match(
      /^(0[1-9]|1[0-2])\/(0[1-9]|[12]\d|3[01])$/
    );


  if(!match){

    return false;

  }


  const month =
    Number(match[1]);


  const day =
    Number(match[2]);


  const daysInMonth =
    new Date(
      2000,
      month,
      0
    ).getDate();


  return day<=daysInMonth;

}


/* =========================================================
   UPDATE WEEKDAY WHEN DATE CHANGES
========================================================= */

function updateWeekdayFromDate(){

  const normalized =
    normalizeDate(
      dateInput.value
    );


  if(
    normalized &&
    validDate(normalized) &&
    year.value
  ){

    dateInput.value =
      normalized;

    weekdayInput.value =
      calculateWeekday(
        year.value,
        normalized
      );

  }else if(
    !dateInput.value ||
    !year.value
  ){

    weekdayInput.value =
      "";

  }

}


dateInput.addEventListener(
  "blur",
  function(){

    const normalized =
      normalizeDate(
        dateInput.value
      );


    if(normalized!==null){

      dateInput.value =
        normalized;

    }


    updateWeekdayFromDate();

  }
);


year.addEventListener(
  "change",
  function(){

    updateWeekdayFromDate();

  }
);


/* =========================================================
   SUBMIT RECORD
========================================================= */

function submitRecord(){

  const selectedYear =
    year.value;


  const normalizedDate =
    normalizeDate(
      dateInput.value
    );


  const ccValue =
    ccInput.value.trim();


  if(
    normalizedDate===null ||
    !validDate(normalizedDate)
  ){

    alert(
      "日期請輸入 MM/DD，例如 09/09"
    );

    dateInput.focus();

    return;

  }


  if(
    ccValue!=="" &&
    (
      !Number.isFinite(
        Number(ccValue)
      ) ||
      Number(ccValue)<0
    )
  ){

    alert(
      "喝水量 CC 請輸入 0 以上的數字。"
    );

    ccInput.focus();

    return;

  }


  let weekday =
    weekdayInput.value || "";


  if(
    !weekday &&
    selectedYear &&
    normalizedDate
  ){

    weekday =
      calculateWeekday(
        selectedYear,
        normalizedDate
      );

  }


  const data={

    year:
      selectedYear,

    date:
      normalizedDate,

    weekday:
      weekday,

    time:
      recordTime.value || "",

    cc:
      ccValue===""
        ? ""
        : Number(ccValue)

  };


  /* =====================================================
     EDIT MODE
  ===================================================== */

  if(editingId!==null){

    const index =
      records.findIndex(
        r =>
          String(r.id) ===
          String(editingId)
      );


    if(index>=0){

      records[index]={
        ...records[index],
        ...data
      };

    }


    save();

    render();

    resetForm();

    return;

  }


  /* =====================================================
     SAME DAY AUTO OVERWRITE
  ===================================================== */

  if(
    selectedYear!=="" &&
    normalizedDate!==""
  ){

    const sameDayIndex =
      records.findIndex(
        r =>
          String(r.year||"") ===
          String(selectedYear) &&
          String(r.date||"") ===
          String(normalizedDate)
      );


    if(sameDayIndex>=0){

      const ok =
        confirm(
          selectedYear+
          " 年 "+
          normalizedDate+
          " 已經有紀錄。\n\n"+
          "要用這次輸入的資料覆蓋原本紀錄嗎？"
        );


      if(!ok){

        return;

      }


      records[
        sameDayIndex
      ]={

        ...records[
          sameDayIndex
        ],

        ...data

      };


      save();

      render();

      resetForm();

      return;

    }

  }


  /* =====================================================
     ADD NEW RECORD
  ===================================================== */

  records.push({

    id:
      Date.now()+
      Math.random(),

    ...data

  });


  save();

  render();

  resetForm();

}


/* =========================================================
   RESET FORM
========================================================= */

function resetForm(){

  year.value="";
  dateInput.value="";
  weekdayInput.value="";
  recordTime.value="";
  ccInput.value="";

  editingId=null;

  formCard.classList.remove(
    "editing"
  );

  formTitle.textContent =
    "💧 新增喝水紀錄";

  mainButton.textContent =
    "＋ 新增紀錄";

  mainButton.className =
    "add";

  cancelButton.style.display =
    "none";

}


/* =========================================================
   EDIT RECORD
========================================================= */

function startEdit(id){

  const record =
    records.find(
      r =>
        String(r.id) ===
        String(id)
    );


  if(!record){

    return;

  }


  editingId =
    record.id;


  year.value =
    record.year || "";


  dateInput.value =
    record.date || "";


  weekdayInput.value =
    record.weekday ||
    calculateWeekday(
      record.year,
      record.date
    ) ||
    "";


  recordTime.value =
    record.time || "";


  ccInput.value =
    record.cc===""
      ? ""
      : record.cc;


  formCard.classList.add(
    "editing"
  );


  formTitle.textContent =
    "✏️ 編輯喝水紀錄";


  mainButton.textContent =
    "💾 儲存修改";


  mainButton.className =
    "save";


  cancelButton.style.display =
    "block";


  window.scrollTo({

    top:0,

    behavior:"smooth"

  });


  setTimeout(
    function(){

      ccInput.focus();

    },
    300
  );

}


/* =========================================================
   CANCEL EDIT
========================================================= */

function cancelEdit(){

  resetForm();

}


/* =========================================================
   VIEW RECORD
========================================================= */

function viewRecord(id){

  const record =
    records.find(
      r =>
        String(r.id) ===
        String(id)
    );


  if(!record){

    return;

  }


  const name =
    petName.value.trim() ||
    "寵物";


  const y =
    record.year ||
    "未填寫";


  const d =
    record.date ||
    "未填寫";


  const w =
    record.weekday ||
    calculateWeekday(
      record.year,
      record.date
    ) ||
    "未填寫";


  const t =
    record.time ||
    "未填寫";


  const c =
    record.cc===""
      ? "未填寫"
      : Number(
          record.cc
        ).toLocaleString()+
        " CC";


  alert(

    "🐾 "+
    name+
    " 喝水紀錄\n\n"+

    "年份："+
    y+
    " 年\n"+

    "日期："+
    d+
    "\n"+

    "星期："+
    w+
    "\n"+

    "時間："+
    t+
    "\n"+

    "喝水量："+
    c+
    "\n\n"+

    "需要修改請按「編輯」。"

  );

}


/* =========================================================
   DELETE RECORD
========================================================= */

function deleteRecord(id){

  const index =
    records.findIndex(
      r =>
        String(r.id) ===
        String(id)
    );


  if(index<0){

    return;

  }


  const ok =
    confirm(
      "確定要刪除這筆喝水紀錄嗎？"
    );


  if(!ok){

    return;

  }


  records.splice(
    index,
    1
  );


  save();

  render();

}


/* =========================================================
   CLEAR ALL
========================================================= */

function clearAll(){

  if(!records.length){

    alert(
      "目前沒有喝水紀錄。"
    );

    return;

  }


  const ok =
    confirm(
      "確定要清除全部喝水紀錄嗎？\n\n"+
      "這個動作無法復原。"
    );


  if(!ok){

    return;

  }


  records=[];

  save();

  render();

}


/* =========================================================
   DATE SORT
========================================================= */

function dateSortValue(record){

  return(
    record.date ||
    "99/99"
  );

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(value){

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  const fy =
    filterYear.value;


  const fm =
    filterMonth.value;


  let list =
    records.filter(
      record => {

        if(
          fy!=="all" &&
          String(
            record.year || ""
          ) !==
          String(fy)
        ){

          return false;

        }


        if(
          fm!=="all"
        ){

          if(
            !record.date ||
            record.date.slice(
              0,
              2
            ) !==
            fm
          ){

            return false;

          }

        }


        return true;

      }
    );


  /* =====================================================
     SORT
  ===================================================== */

  list.sort(
    (a,b)=>{

      const ya =
        a.year || "999";

      const yb =
        b.year || "999";


      if(ya!==yb){

        return String(yb)
          .localeCompare(
            String(ya)
          );

      }


      const da =
        dateSortValue(a);

      const db =
        dateSortValue(b);


      if(da!==db){

        return db.localeCompare(
          da
        );

      }


      return String(
        b.time || ""
      ).localeCompare(
        String(
          a.time || ""
        )
      );

    }
  );


  /* =====================================================
     STATISTICS
  ===================================================== */

  const values =
    list

      .filter(
        r =>
          r.cc!=="" &&
          Number.isFinite(
            Number(r.cc)
          )
      )

      .map(
        r =>
          Number(r.cc)
      );


  const total =
    values.reduce(
      (sum,value)=>
        sum+value,
      0
    );


  const avg =
    values.length
      ? Math.round(
          total/
          values.length
        )
      : 0;


  document.getElementById(
    "totalCC"
  ).textContent =
    total.toLocaleString();


  document.getElementById(
    "count"
  ).textContent =
    list.length;


  document.getElementById(
    "avg"
  ).textContent =
    avg.toLocaleString();


  /* =====================================================
     SCOPE
  ===================================================== */

  let scope="";


  if(fy!=="all"){

    scope +=
      fy+
      " 年";

  }


  if(fm!=="all"){

    scope +=
      (scope?" ":"")+
      fm+
      " 月";

  }


  if(!scope){

    scope =
      "全部紀錄";

  }


  document.getElementById(
    "monthTotal"
  ).innerHTML =

    `<div class="monthTotal">
      💧 ${scope}：${total.toLocaleString()} CC
    </div>`;


  /* =====================================================
     RECORD LIST
  ===================================================== */

  const box =
    document.getElementById(
      "records"
    );


  if(!list.length){

    box.innerHTML =
      '<div class="empty">尚無紀錄 💧</div>';

    return;

  }


  box.innerHTML =
    list.map(
      record => {

        const y =
          record.year
            ? record.year+
              " 年"
            : "年份未填";


        const d =
          record.date ||
          "日期未填";


        const w =
          record.weekday ||
          calculateWeekday(
            record.year,
            record.date
          ) ||
          "星期未填";


        const t =
          record.time ||
          "時間未填";


        const cc =
          record.cc===""
            ? "未填"
            : Number(
                record.cc
              ).toLocaleString()+
              " <small>CC</small>";


        return `

          <div class="record">

            <div class="recordTop">

              <div>

                <div class="date">
                  ${escapeHTML(d)}
                </div>

                <div class="year">
                  ${escapeHTML(y)}
                </div>

                <div class="time">
                  ${escapeHTML(w)}
                  ・
                  ${escapeHTML(t)}
                </div>

              </div>


              <div class="cc">
                ${cc}
              </div>

            </div>


            <div class="actions">

              <button
                class="view"
                type="button"
                data-action="view"
                data-id="${record.id}"
              >
                👁️ 查看
              </button>


              <button
                class="edit"
                type="button"
                data-action="edit"
                data-id="${record.id}"
              >
                ✏️ 編輯
              </button>


              <button
                class="del"
                type="button"
                data-action="delete"
                data-id="${record.id}"
              >
                🗑️ 刪除
              </button>

            </div>

          </div>

        `;

      }
    )
    .join("");

}


/* =========================================================
   BUTTON EVENTS
   Use addEventListener instead of inline onclick.
========================================================= */

mainButton.addEventListener(
  "click",
  function(){

    submitRecord();

  }
);


cancelButton.addEventListener(
  "click",
  function(){

    cancelEdit();

  }
);


clearButton.addEventListener(
  "click",
  function(){

    clearAll();

  }
);


filterYear.addEventListener(
  "change",
  function(){

    render();

  }
);


filterMonth.addEventListener(
  "change",
  function(){

    render();

  }
);


/* =========================================================
   RECORD BUTTON EVENTS
========================================================= */

document
  .getElementById(
    "records"
  )
  .addEventListener(
    "click",
    function(event){

      const button =
        event.target.closest(
          "button[data-action]"
        );


      if(!button){

        return;

      }


      const action =
        button.dataset.action;


      const id =
        button.dataset.id;


      if(action==="view"){

        viewRecord(id);

      }


      if(action==="edit"){

        startEdit(id);

      }


      if(action==="delete"){

        deleteRecord(id);

      }

    }
  );


/* =========================================================
   INITIAL RENDER
========================================================= */

render();


/* =========================================================
   AUTOMATICALLY FILL CURRENT DATE/TIME
   when opening a new empty form.
========================================================= */

if(
  !year.value &&
  !dateInput.value &&
  !weekdayInput.value &&
  !recordTime.value
){

  fillNow();

}


</script>
