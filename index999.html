<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff6f91">
<title>🌸 生理期完整管理</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",
    "Noto Sans TC","Microsoft JhengHei",sans-serif;
    background:#fff5f7;
    color:#333;
}

button,
input,
textarea,
select{
    font:inherit;
}

.header{
    background:linear-gradient(135deg,#ff6f91,#ff9db3);
    color:white;
    padding:24px 18px 20px;
    text-align:center;
    box-shadow:0 3px 12px rgba(255,105,135,.25);
}

.header h1{
    margin:0;
    font-size:26px;
}

.header p{
    margin:7px 0 0;
    opacity:.9;
    font-size:14px;
}

.container{
    width:min(720px,100%);
    margin:auto;
    padding:14px;
}

.card{
    background:#fff;
    border-radius:18px;
    padding:18px;
    margin-bottom:14px;
    box-shadow:0 3px 15px rgba(0,0,0,.06);
}

.card-title{
    font-size:19px;
    font-weight:800;
    margin-bottom:14px;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.field{
    margin-bottom:13px;
}

.field label{
    display:block;
    font-size:14px;
    font-weight:700;
    margin-bottom:6px;
}

input,
select,
textarea{
    width:100%;
    border:1px solid #ddd;
    border-radius:12px;
    padding:12px;
    background:#fff;
    outline:none;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#ff6f91;
}

textarea{
    min-height:80px;
    resize:vertical;
}

.month-buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
    margin-top:10px;
}

.month-buttons button{
    border:0;
    background:#fff0f3;
    color:#d94d70;
    border-radius:10px;
    padding:9px 3px;
    font-weight:700;
}

.month-buttons button.active{
    background:#ff6f91;
    color:white;
}

.date-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.btn{
    border:0;
    border-radius:13px;
    padding:13px;
    font-weight:800;
    cursor:pointer;
}

.btn-start{
    background:#ffe0e7;
    color:#d83e64;
}

.btn-end{
    background:#ffd0dc;
    color:#b52e53;
}

.btn-main{
    width:100%;
    background:#ff6f91;
    color:white;
    font-size:17px;
}

.btn-secondary{
    width:100%;
    background:#f1f1f1;
    color:#555;
}

.btn-danger{
    background:#ffe4e4;
    color:#d33;
}

.btn-small{
    padding:8px 10px;
    font-size:13px;
}

.save-status{
    text-align:center;
    font-size:13px;
    color:#777;
    margin-top:8px;
}

.notice{
    background:#fff7e5;
    border:1px solid #ffe2a8;
    color:#856404;
    border-radius:12px;
    padding:11px;
    font-size:13px;
    line-height:1.6;
    margin-bottom:14px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.stat{
    background:#fff5f7;
    border-radius:13px;
    padding:12px 5px;
    text-align:center;
}

.stat-number{
    font-size:23px;
    font-weight:900;
    color:#e95376;
}

.stat-label{
    font-size:12px;
    color:#777;
    margin-top:3px;
}

.calendar{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:4px;
}

.calendar-head{
    text-align:center;
    font-size:12px;
    color:#888;
    padding:5px 0;
}

.calendar-day{
    min-height:45px;
    border-radius:9px;
    background:#fafafa;
    padding:5px;
    font-size:12px;
    position:relative;
}

.calendar-day.period{
    background:#ffe0e7;
    color:#c93458;
    font-weight:800;
}

.calendar-day.today{
    outline:2px solid #ff6f91;
}

.calendar-day .blood{
    position:absolute;
    right:4px;
    bottom:3px;
    font-size:12px;
}

.record{
    border:1px solid #eee;
    border-radius:15px;
    padding:14px;
    margin-bottom:10px;
}

.record-header{
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:flex-start;
}

.record-title{
    font-weight:900;
    color:#d74467;
}

.badge{
    display:inline-block;
    background:#fff0f3;
    color:#d74467;
    border-radius:20px;
    padding:4px 8px;
    font-size:12px;
    margin:3px 3px 0 0;
}

.record-info{
    color:#666;
    font-size:13px;
    line-height:1.7;
    margin-top:8px;
}

.record-actions{
    display:flex;
    gap:7px;
    margin-top:10px;
}

.search{
    margin-bottom:12px;
}

.empty{
    text-align:center;
    color:#999;
    padding:25px 10px;
}

.bottom-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.modal-bg{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:999;
}

.modal-bg.show{
    display:flex;
}

.modal{
    width:min(420px,100%);
    background:white;
    border-radius:20px;
    padding:22px;
}

.modal h3{
    margin-top:0;
}

.modal p{
    line-height:1.7;
    color:#555;
}

.modal-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);
    background:#333;
    color:white;
    padding:11px 17px;
    border-radius:30px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:1000;
    font-size:14px;
}

.toast.show{
    opacity:1;
}

.hidden{
    display:none!important;
}

@media(max-width:480px){
    .row{
        grid-template-columns:1fr;
    }

    .stats{
        grid-template-columns:repeat(3,1fr);
    }

    .month-buttons{
        grid-template-columns:repeat(3,1fr);
    }
}
</style>
</head>

<body>

<header class="header">
    <h1>🌸 生理期完整管理</h1>
    <p>開始日、結束日可以分開儲存</p>
</header>

<main class="container">

    <div class="card">

        <div class="card-title">📅 選擇年月</div>

        <div class="row">
            <div class="field">
                <label>年份</label>
                <select id="year"></select>
            </div>

            <div class="field">
                <label>月份</label>
                <select id="month"></select>
            </div>
        </div>

        <div class="month-buttons" id="monthButtons"></div>

    </div>


    <div class="card">

        <div class="card-title">🩸 登記生理期</div>

        <div class="notice">
            💡 開始日與結束日可以分開儲存。<br>
            例如今天只有知道生理期開始，就先儲存開始日；等生理期結束後，再補上結束日。
        </div>

        <div class="field">
            <label>🩸 生理期開始日</label>
            <input type="date" id="startDate">
        </div>

        <button type="button" class="btn btn-start" id="saveStartBtn">
            🩸 儲存開始日
        </button>

        <br><br>

        <div class="field">
            <label>🏁 生理期結束日</label>
            <input type="date" id="endDate">
        </div>

        <button type="button" class="btn btn-end" id="saveEndBtn">
            🏁 儲存結束日
        </button>

        <br><br>

        <div class="field">
            <label>💧 經血量</label>

            <select id="flow">
                <option value="">未記錄</option>
                <option value="少">少</option>
                <option value="正常">正常</option>
                <option value="多">多</option>
                <option value="非常多">非常多</option>
            </select>
        </div>

        <div class="field">
            <label>🤕 症狀</label>

            <div id="symptomOptions">
                <button type="button" class="btn btn-secondary btn-small symptom" data-value="無不適">無不適</button>
                <button type="button" class="btn btn-secondary btn-small symptom" data-value="輕微腹痛">輕微腹痛</button>
                <button type="button" class="btn btn-secondary btn-small symptom" data-value="腹痛">腹痛</button>
                <button type="button" class="btn btn-secondary btn-small symptom" data-value="腰痠">腰痠</button>
                <button type="button" class="btn btn-secondary btn-small symptom" data-value="頭痛">頭痛</button>
                <button type="button" class="btn btn-secondary btn-small symptom" data-value="胸部脹痛">胸部脹痛</button>
                <button type="button" class="btn btn-secondary btn-small symptom" data-value="情緒變化">情緒變化</button>
            </div>
        </div>

        <div class="field">
            <label>📝 備註</label>
            <textarea id="note" placeholder="可以記錄身體狀況、經期感受等等"></textarea>
        </div>

        <button type="button" class="btn btn-main" id="saveInfoBtn">
            💾 儲存其他資料
        </button>

        <button type="button" class="btn btn-secondary hidden" id="cancelEditBtn">
            取消修改
        </button>

        <div class="save-status" id="saveStatus">
            尚未儲存
        </div>

    </div>


    <div class="card">

        <div class="card-title">📊 本月統計</div>

        <div class="stats">

            <div class="stat">
                <div class="stat-number" id="periodCount">0</div>
                <div class="stat-label">生理期次數</div>
            </div>

            <div class="stat">
                <div class="stat-number" id="periodDays">0</div>
                <div class="stat-label">生理期天數</div>
            </div>

            <div class="stat">
                <div class="stat-number" id="avgCycle">—</div>
                <div class="stat-label">平均週期</div>
            </div>

        </div>

        <br>

        <div id="prediction"></div>

    </div>


    <div class="card">

        <div class="card-title">📆 本月月曆</div>

        <div class="calendar" id="calendar"></div>

    </div>


    <div class="card">

        <div class="card-title">📋 生理期紀錄</div>

        <input
            class="search"
            id="search"
            placeholder="🔎 搜尋日期或備註..."
        >

        <div id="records"></div>

    </div>


    <div class="card">

        <div class="card-title">💾 資料管理</div>

        <div class="bottom-actions">

            <button type="button" class="btn btn-secondary" id="backupBtn">
                📥 備份資料
            </button>

            <button type="button" class="btn btn-secondary" id="restoreBtn">
                📤 還原資料
            </button>

            <button type="button" class="btn btn-danger" id="clearMonthBtn">
                🗑️ 清除本月
            </button>

            <button type="button" class="btn btn-danger" id="clearAllBtn">
                🗑️ 清除全部
            </button>

        </div>

        <input
            type="file"
            id="restoreFile"
            accept=".json"
            class="hidden"
        >

    </div>

</main>


<div class="modal-bg" id="modalBg">

    <div class="modal">

        <h3 id="modalTitle">確認操作</h3>

        <p id="modalText"></p>

        <div class="modal-actions">

            <button
                type="button"
                class="btn btn-secondary"
                id="modalCancel"
            >
                取消
            </button>

            <button
                type="button"
                class="btn btn-danger"
                id="modalConfirm"
            >
                確定
            </button>

        </div>

    </div>

</div>


<div class="toast" id="toast"></div>


<script>

const STORAGE_KEY = "my_period_records_v2_separate_dates";

let data = [];
let editingId = null;
let selectedSymptoms = [];
let pendingAction = null;


function $(id){
    return document.getElementById(id);
}


/* =========================
   初始化
========================= */

function init(){

    loadData();

    setupYears();
    setupMonths();

    const now = new Date();

    $("year").value = now.getFullYear();
    $("month").value = now.getMonth() + 1;

    bindEvents();

    renderAll();

}


/* =========================
   年份
========================= */

function setupYears(){

    const select = $("year");

    for(let y=2020;y<=2040;y++){

        const option = document.createElement("option");

        option.value = y;
        option.textContent = y + " 年";

        select.appendChild(option);
    }

}


/* =========================
   月份
========================= */

function setupMonths(){

    const select = $("month");

    for(let m=1;m<=12;m++){

        const option = document.createElement("option");

        option.value = m;
        option.textContent = m + " 月";

        select.appendChild(option);
    }

}


/* =========================
   綁定事件
========================= */

function bindEvents(){

    $("year").addEventListener("change",renderAll);

    $("month").addEventListener("change",renderAll);

    $("saveStartBtn").addEventListener("click",saveStartDate);

    $("saveEndBtn").addEventListener("click",saveEndDate);

    $("saveInfoBtn").addEventListener("click",saveOtherInfo);

    $("cancelEditBtn").addEventListener("click",cancelEdit);

    $("search").addEventListener("input",renderRecords);

    $("backupBtn").addEventListener("click",backupData);

    $("restoreBtn").addEventListener("click",()=>{
        $("restoreFile").click();
    });

    $("restoreFile").addEventListener("change",restoreData);

    $("clearMonthBtn").addEventListener("click",clearMonth);

    $("clearAllBtn").addEventListener("click",clearAll);

    $("modalCancel").addEventListener("click",closeModal);

    $("modalConfirm").addEventListener("click",confirmModal);

    document.querySelectorAll(".symptom").forEach(btn=>{

        btn.addEventListener("click",()=>{

            const value = btn.dataset.value;

            if(value==="無不適"){

                selectedSymptoms = ["無不適"];

            }else{

                selectedSymptoms =
                    selectedSymptoms.filter(x=>x!=="無不適");

                if(selectedSymptoms.includes(value)){

                    selectedSymptoms =
                        selectedSymptoms.filter(x=>x!==value);

                }else{

                    selectedSymptoms.push(value);

                }

            }

            updateSymptomButtons();

        });

    });

}


/* =========================
   讀取資料
========================= */

function loadData(){

    try{

        const saved =
            localStorage.getItem(STORAGE_KEY);

        data = saved ? JSON.parse(saved) : [];

        if(!Array.isArray(data)){
            data=[];
        }

    }catch(e){

        data=[];

    }

}


/* =========================
   儲存資料
========================= */

function saveData(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );

    $("saveStatus").textContent =
        "✓ 已自動儲存 " +
        new Date().toLocaleTimeString();

}


/* =========================
   找日期紀錄
========================= */

function getRecordByStart(start){

    return data.find(x=>x.start===start);

}


function getRecordByEnd(end){

    return data.find(x=>x.end===end);

}


/* =========================
   儲存開始日
========================= */

function saveStartDate(){

    const start = $("startDate").value;

    if(!start){

        showToast("請先選擇生理期開始日");

        return;
    }


    let record = getRecordByStart(start);


    if(record){

        showToast("這個開始日已經儲存過了");

        return;
    }


    record = {

        id:Date.now(),

        start:start,

        end:"",

        flow:$("flow").value,

        symptoms:[...selectedSymptoms],

        note:$("note").value.trim(),

        createdAt:new Date().toISOString(),

        updatedAt:new Date().toISOString()

    };


    data.push(record);

    saveData();

    resetForm();

    renderAll();

    showToast("🩸 生理期開始日已儲存");

}


/* =========================
   儲存結束日
========================= */

function saveEndDate(){

    const end = $("endDate").value;

    if(!end){

        showToast("請先選擇生理期結束日");

        return;
    }


    /*
      優先尋找：
      1. 沒有結束日的最近開始紀錄
      2. 如果沒有，尋找同日期紀錄
    */

    let candidates =
        data
        .filter(x=>x.start && !x.end)
        .sort((a,b)=>
            new Date(b.start)-new Date(a.start)
        );


    let record = candidates[0];


    /*
      如果沒有未完成紀錄，
      建立一筆只有結束日的紀錄
    */

    if(!record){

        record = {

            id:Date.now(),

            start:"",

            end:end,

            flow:$("flow").value,

            symptoms:[...selectedSymptoms],

            note:$("note").value.trim(),

            createdAt:new Date().toISOString(),

            updatedAt:new Date().toISOString()

        };

        data.push(record);

    }else{

        if(
            record.start &&
            new Date(end)<new Date(record.start)
        ){

            showToast("❗ 結束日不能早於開始日");

            return;
        }


        record.end=end;

        record.flow =
            $("flow").value || record.flow;

        record.symptoms =
            selectedSymptoms.length
            ? [...selectedSymptoms]
            : record.symptoms;

        record.note =
            $("note").value.trim() || record.note;

        record.updatedAt =
            new Date().toISOString();

    }


    saveData();

    resetForm();

    renderAll();

    showToast("🏁 生理期結束日已儲存");

}


/* =========================
   儲存其他資料
========================= */

function saveOtherInfo(){

    const start = $("startDate").value;
    const end = $("endDate").value;


    if(!start && !end){

        showToast("請至少輸入開始日或結束日");

        return;
    }


    let record = null;


    if(editingId){

        record =
            data.find(x=>x.id===editingId);

    }


    if(!record && start){

        record = getRecordByStart(start);

    }


    if(!record && end){

        record = getRecordByEnd(end);

    }


    if(!record){

        record={

            id:Date.now(),

            start:start || "",

            end:end || "",

            flow:$("flow").value,

            symptoms:[...selectedSymptoms],

            note:$("note").value.trim(),

            createdAt:new Date().toISOString(),

            updatedAt:new Date().toISOString()

        };

        data.push(record);

    }else{

        if(
            start &&
            end &&
            new Date(end)<new Date(start)
        ){

            showToast("❗ 結束日不能早於開始日");

            return;
        }


        if(start) record.start=start;

        if(end) record.end=end;

        record.flow=$("flow").value;

        record.symptoms=[...selectedSymptoms];

        record.note=$("note").value.trim();

        record.updatedAt =
            new Date().toISOString();

    }


    saveData();

    resetForm();

    renderAll();

    showToast(
        editingId
        ? "✓ 紀錄已修改"
        : "✓ 資料已儲存"
    );

}


/* =========================
   編輯
========================= */

function editRecord(id){

    const record =
        data.find(x=>x.id===id);

    if(!record)return;


    editingId=id;

    $("startDate").value=record.start || "";

    $("endDate").value=record.end || "";

    $("flow").value=record.flow || "";

    $("note").value=record.note || "";

    selectedSymptoms =
        Array.isArray(record.symptoms)
        ? [...record.symptoms]
        : [];

    updateSymptomButtons();

    $("cancelEditBtn").classList.remove("hidden");

    $("saveInfoBtn").textContent =
        "💾 儲存修改";


    document
        .querySelector(".card:nth-of-type(2)")
        ?.scrollIntoView({
            behavior:"smooth",
            block:"start"
        });

}


/* =========================
   取消修改
========================= */

function cancelEdit(){

    editingId=null;

    resetForm();

}


/* =========================
   重設表單
========================= */

function resetForm(){

    editingId=null;

    $("startDate").value="";

    $("endDate").value="";

    $("flow").value="";

    $("note").value="";

    selectedSymptoms=[];

    updateSymptomButtons();

    $("cancelEditBtn").classList.add("hidden");

    $("saveInfoBtn").textContent =
        "💾 儲存其他資料";

}


/* =========================
   症狀按鈕
========================= */

function updateSymptomButtons(){

    document.querySelectorAll(".symptom")
    .forEach(btn=>{

        const selected =
            selectedSymptoms.includes(
                btn.dataset.value
            );

        if(selected){

            btn.style.background="#ff6f91";

            btn.style.color="white";

        }else{

            btn.style.background="#f1f1f1";

            btn.style.color="#555";

        }

    });

}


/* =========================
   月份篩選
========================= */

function currentMonthRecords(){

    const year =
        Number($("year").value);

    const month =
        Number($("month").value);


    return data.filter(record=>{

        const dates=[];

        if(record.start)dates.push(record.start);

        if(record.end)dates.push(record.end);


        return dates.some(date=>{

            const d=new Date(date);

            return(
                d.getFullYear()===year &&
                d.getMonth()+1===month
            );

        });

    });

}


/* =========================
   Render 全部
========================= */

function renderAll(){

    renderMonthButtons();

    renderStats();

    renderPrediction();

    renderCalendar();

    renderRecords();

}


/* =========================
   月份按鈕
========================= */

function renderMonthButtons(){

    const box=$("monthButtons");

    box.innerHTML="";


    for(let m=1;m<=12;m++){

        const btn=document.createElement("button");

        btn.textContent=m+"月";

        if(
            Number($("month").value)===m
        ){

            btn.classList.add("active");

        }


        btn.addEventListener("click",()=>{

            $("month").value=m;

            renderAll();

        });


        box.appendChild(btn);

    }

}


/* =========================
   統計
========================= */

function renderStats(){

    const records =
        currentMonthRecords();


    $("periodCount").textContent =
        records.length;


    let days=0;


    records.forEach(record=>{

        if(record.start && record.end){

            const start =
                new Date(record.start);

            const end =
                new Date(record.end);

            const diff =
                Math.floor(
                    (end-start)/86400000
                )+1;

            if(diff>0 && diff<100){

                days+=diff;

            }

        }

    });


    $("periodDays").textContent=days;


    const avg=calculateAverageCycle();

    $("avgCycle").textContent =
        avg ? avg+" 天" : "—";

}


/* =========================
   平均週期
========================= */

function calculateAverageCycle(){

    const starts =
        data
        .filter(x=>x.start)
        .map(x=>x.start)
        .sort();


    if(starts.length<2)return null;


    const gaps=[];


    for(let i=1;i<starts.length;i++){

        const a =
            new Date(starts[i-1]);

        const b =
            new Date(starts[i]);


        const diff =
            Math.round(
                (b-a)/86400000
            );


        if(diff>0 && diff<100){

            gaps.push(diff);

        }

    }


    if(!gaps.length)return null;


    return Math.round(
        gaps.reduce((a,b)=>a+b,0) /
        gaps.length
    );

}


/* =========================
   下次預估
========================= */

function renderPrediction(){

    const avg =
        calculateAverageCycle();


    const starts =
        data
        .filter(x=>x.start)
        .sort((a,b)=>
            new Date(b.start) -
            new Date(a.start)
        );


    if(!avg || !starts.length){

        $("prediction").innerHTML=
            `<div class="notice">
            📌 累積至少 2 次生理期開始日後，
            系統才能估算平均週期。
            </div>`;

        return;
    }


    const latest =
        new Date(starts[0].start);


    latest.setDate(
        latest.getDate()+avg
    );


    const text =
        latest.getFullYear()+
        "/" +
        String(latest.getMonth()+1).padStart(2,"0")+
        "/" +
        String(latest.getDate()).padStart(2,"0");


    $("prediction").innerHTML=
        `<div class="notice">
        🔮 預估下次生理期：
        <strong>${text}</strong><br>
        平均週期約 ${avg} 天。<br>
        <small>※ 僅供紀錄參考，不是醫療預測。</small>
        </div>`;

}


/* =========================
   月曆
========================= */

function renderCalendar(){

    const box=$("calendar");

    box.innerHTML="";


    const year =
        Number($("year").value);

    const month =
        Number($("month").value);


    const heads =
        ["日","一","二","三","四","五","六"];


    heads.forEach(x=>{

        const div=
            document.createElement("div");

        div.className="calendar-head";

        div.textContent=x;

        box.appendChild(div);

    });


    const first =
        new Date(year,month-1,1);

    const last =
        new Date(year,month,0);


    for(let i=0;i<first.getDay();i++){

        const empty =
            document.createElement("div");

        box.appendChild(empty);

    }


    for(let day=1;day<=last.getDate();day++){

        const div=
            document.createElement("div");

        div.className="calendar-day";

        div.textContent=day;


        const date =
            `${year}-${String(month).padStart(2,"0")}-${String(day).padStart(2,"0")}`;


        const today =
            new Date();


        if(
            today.getFullYear()===year &&
            today.getMonth()+1===month &&
            today.getDate()===day
        ){

            div.classList.add("today");

        }


        let isPeriod=false;


        data.forEach(record=>{

            if(!record.start)return;


            const start =
                new Date(record.start);


            const end =
                record.end
                ? new Date(record.end)
                : new Date(record.start);


            const current =
                new Date(date);


            if(
                current>=start &&
                current<=end
            ){

                isPeriod=true;

            }

        });


        if(isPeriod){

            div.classList.add("period");

            const blood =
                document.createElement("span");

            blood.className="blood";

            blood.textContent="🩸";

            div.appendChild(blood);

        }


        box.appendChild(div);

    }

}


/* =========================
   紀錄列表
========================= */

function renderRecords(){

    const box=$("records");

    const keyword =
        $("search").value.trim().toLowerCase();


    let records =
        currentMonthRecords();


    if(keyword){

        records =
            records.filter(record=>{

                const text =
                    JSON.stringify(record)
                    .toLowerCase();

                return text.includes(keyword);

            });

    }


    records.sort((a,b)=>{

        const da =
            a.start || a.end || "";

        const db =
            b.start || b.end || "";

        return db.localeCompare(da);

    });


    if(!records.length){

        box.innerHTML=
            `<div class="empty">
            目前沒有生理期紀錄 🌸
            </div>`;

        return;

    }


    box.innerHTML="";


    records.forEach(record=>{

        const div =
            document.createElement("div");

        div.className="record";


        let dateText="";


        if(record.start && record.end){

            dateText =
                `🩸 ${formatDate(record.start)}
                ～ ${formatDate(record.end)}`;

        }else if(record.start){

            dateText =
                `🩸 ${formatDate(record.start)}
                ～ <strong>尚未結束</strong>`;

        }else if(record.end){

            dateText =
                `🏁 開始日未記錄
                ～ ${formatDate(record.end)}`;

        }


        let days="";


        if(record.start && record.end){

            const diff =
                Math.floor(
                    (
                        new Date(record.end) -
                        new Date(record.start)
                    )/86400000
                )+1;

            if(diff>0){

                days=`<br>📅 共 ${diff} 天`;

            }

        }


        let badges="";


        if(record.flow){

            badges +=
                `<span class="badge">
                💧 ${escapeHtml(record.flow)}
                </span>`;

        }


        if(Array.isArray(record.symptoms)){

            record.symptoms.forEach(symptom=>{

                badges +=
                    `<span class="badge">
                    ${escapeHtml(symptom)}
                    </span>`;

            });

        }


        div.innerHTML=`

            <div class="record-header">

                <div>

                    <div class="record-title">
                        ${dateText}
                    </div>

                    <div>
                        ${badges}
                    </div>

                </div>

            </div>

            <div class="record-info">

                ${days}

                ${
                    record.note
                    ? `<br>📝 ${escapeHtml(record.note)}`
                    : ""
                }

            </div>

            <div class="record-actions">

                <button
                    type="button"
                    class="btn btn-secondary btn-small edit-btn"
                >
                    ✏️ 修改
                </button>

                <button
                    type="button"
                    class="btn btn-danger btn-small delete-btn"
                >
                    🗑️ 刪除
                </button>

            </div>
        `;


        div.querySelector(".edit-btn")
            .addEventListener(
                "click",
                ()=>editRecord(record.id)
            );


        div.querySelector(".delete-btn")
            .addEventListener(
                "click",
                ()=>deleteRecord(record.id)
            );


        box.appendChild(div);

    });

}


/* =========================
   刪除
========================= */

function deleteRecord(id){

    const record =
        data.find(x=>x.id===id);

    if(!record)return;


    openModal(
        "刪除這筆紀錄？",
        "刪除後無法復原。",
        ()=>{
            data =
                data.filter(x=>x.id!==id);

            saveData();

            renderAll();

            showToast("已刪除");

        }
    );

}


/* =========================
   清除本月
========================= */

function clearMonth(){

    const year =
        Number($("year").value);

    const month =
        Number($("month").value);


    const count =
        currentMonthRecords().length;


    if(!count){

        showToast("本月沒有資料");

        return;
    }


    openModal(
        "清除本月資料？",
        `確定要刪除 ${year} 年 ${month} 月的 ${count} 筆資料嗎？`,
        ()=>{

            data =
                data.filter(record=>{

                    const dates=[];

                    if(record.start)dates.push(record.start);

                    if(record.end)dates.push(record.end);


                    return !dates.some(date=>{

                        const d =
                            new Date(date);

                        return(
                            d.getFullYear()===year &&
                            d.getMonth()+1===month
                        );

                    });

                });


            saveData();

            renderAll();

            showToast("本月資料已清除");

        }
    );

}


/* =========================
   清除全部
========================= */

function clearAll(){

    if(!data.length){

        showToast("目前沒有資料");

        return;
    }


    openModal(
        "⚠️ 清除全部資料？",
        "所有生理期資料都會被刪除，而且無法復原。建議先備份。",
        ()=>{

            data=[];

            saveData();

            renderAll();

            showToast("全部資料已清除");

        }
    );

}


/* =========================
   備份
========================= */

function backupData(){

    const blob =
        new Blob(
            [
                JSON.stringify(
                    data,
                    null,
                    2
                )
            ],
            {
                type:"application/json"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const a =
        document.createElement("a");

    a.href=url;

    a.download=
        "生理期備份_" +
        new Date()
        .toISOString()
        .slice(0,10)+
        ".json";


    a.click();

    URL.revokeObjectURL(url);

    showToast("📥 備份完成");

}


/* =========================
   還原
========================= */

function restoreData(event){

    const file =
        event.target.files[0];

    if(!file)return;


    const reader =
        new FileReader();


    reader.onload=()=>{

        try{

            const imported =
                JSON.parse(reader.result);


            if(!Array.isArray(imported)){

                throw new Error();

            }


            openModal(
                "還原資料？",
                `備份中共有 ${imported.length} 筆紀錄。還原後會取代目前資料。`,
                ()=>{

                    data=imported;

                    saveData();

                    renderAll();

                    showToast("📤 還原完成");

                }
            );


        }catch(e){

            showToast("❌ 備份檔案格式錯誤");

        }

    };


    reader.readAsText(file);

    event.target.value="";

}


/* =========================
   Modal
========================= */

function openModal(title,text,action){

    $("modalTitle").textContent=title;

    $("modalText").textContent=text;

    pendingAction=action;

    $("modalBg").classList.add("show");

}


function closeModal(){

    pendingAction=null;

    $("modalBg").classList.remove("show");

}


function confirmModal(){

    const action=pendingAction;

    closeModal();

    if(action)action();

}


/* =========================
   Toast
========================= */

let toastTimer;


function showToast(text){

    const toast=$("toast");

    toast.textContent=text;

    toast.classList.add("show");


    clearTimeout(toastTimer);


    toastTimer=setTimeout(()=>{

        toast.classList.remove("show");

    },2200);

}


/* =========================
   日期格式
========================= */

function formatDate(date){

    if(!date)return "";

    const d =
        new Date(date);


    return(
        d.getFullYear()+
        "/" +
        String(d.getMonth()+1).padStart(2,"0")+
        "/" +
        String(d.getDate()).padStart(2,"0")
    );

}


/* =========================
   防止 HTML 注入
========================= */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   啟動
========================= */

document.addEventListener(
    "DOMContentLoaded",
    init
);

</script>
