<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<meta name="theme-color" content="#ffffff">

<title>Lucky 寵物喝水紀錄</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
    background:#f5f7fb;
    color:#202124;
}

body{
    min-height:100vh;
}

button,
input,
select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.container{
    width:100%;
    max-width:1100px;
    margin:0 auto;
    padding:20px;
}

/* =========================
   HEADER
========================= */

.header{
    background:#ffffff;
    border-radius:22px;
    padding:22px;
    margin-bottom:18px;
    box-shadow:0 5px 20px rgba(0,0,0,0.06);
}

.header-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    flex-wrap:wrap;
}

.title-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.pet-icon{
    width:55px;
    height:55px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f1f5ff;
    font-size:30px;
}

h1{
    margin:0;
    font-size:27px;
    font-weight:800;
}

.subtitle{
    margin-top:5px;
    color:#777;
    font-size:14px;
}

/* =========================
   DASHBOARD
========================= */

.dashboard{
    display:grid;
    grid-template-columns:
        repeat(4, minmax(0,1fr));
    gap:12px;
    margin-bottom:18px;
}

.card{
    background:#ffffff;
    border-radius:18px;
    padding:18px;
    box-shadow:0 5px 18px rgba(0,0,0,0.05);
}

.stat-label{
    font-size:13px;
    color:#777;
    margin-bottom:8px;
}

.stat-value{
    font-size:27px;
    font-weight:800;
    line-height:1.2;
}

.stat-unit{
    font-size:13px;
    color:#888;
    margin-left:3px;
}

/* =========================
   FORM
========================= */

.form-card{
    background:#ffffff;
    border-radius:20px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 5px 20px rgba(0,0,0,0.06);
}

.section-title{
    font-size:19px;
    font-weight:800;
    margin-bottom:15px;
}

.form-grid{
    display:grid;
    grid-template-columns:
        repeat(4, minmax(0,1fr));
    gap:13px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.field label{
    font-size:13px;
    font-weight:700;
    color:#555;
}

.field input,
.field select{
    width:100%;
    min-height:48px;
    border:1px solid #dfe3ea;
    border-radius:12px;
    background:#fff;
    padding:0 13px;
    font-size:16px;
    outline:none;
    transition:0.2s;
}

.field input:focus,
.field select:focus{
    border-color:#6b7cff;
    box-shadow:
        0 0 0 3px rgba(107,124,255,0.12);
}

.date-row{
    display:flex;
    gap:8px;
}

.date-row input{
    flex:1;
}

.small-btn{
    border:0;
    border-radius:11px;
    padding:0 14px;
    min-height:48px;
    background:#eef1ff;
    color:#4353d8;
    font-weight:700;
    white-space:nowrap;
}

.small-btn:active{
    transform:scale(0.97);
}

.date-info{
    min-height:20px;
    color:#666;
    font-size:13px;
}

.form-actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:16px;
}

.btn{
    min-height:48px;
    border:0;
    border-radius:13px;
    padding:0 20px;
    font-size:16px;
    font-weight:800;
}

.btn-primary{
    background:#5c6cff;
    color:white;
}

.btn-secondary{
    background:#eef0f5;
    color:#444;
}

.btn-danger{
    background:#fff0f0;
    color:#d33;
}

.btn:active{
    transform:scale(0.98);
}

/* =========================
   TODAY STATUS
========================= */

.today-card{
    background:#ffffff;
    border-radius:20px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 5px 20px rgba(0,0,0,0.06);
}

.today-grid{
    display:grid;
    grid-template-columns:
        repeat(3, minmax(0,1fr));
    gap:12px;
}

.today-box{
    background:#f8f9fc;
    border-radius:15px;
    padding:15px;
}

.today-box-title{
    font-size:13px;
    color:#777;
    margin-bottom:5px;
}

.today-box-value{
    font-size:23px;
    font-weight:800;
}

/* =========================
   ANALYSIS
========================= */

.analysis-card{
    background:#ffffff;
    border-radius:20px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 5px 20px rgba(0,0,0,0.06);
}

.analysis-message{
    padding:15px;
    border-radius:14px;
    background:#f7f8fb;
    line-height:1.7;
    font-size:14px;
}

.analysis-list{
    margin:12px 0 0;
    padding-left:20px;
}

.analysis-list li{
    margin-bottom:7px;
}

/* =========================
   CHART
========================= */

.chart-card{
    background:#ffffff;
    border-radius:20px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 5px 20px rgba(0,0,0,0.06);
}

.chart-wrapper{
    width:100%;
    overflow:hidden;
}

#waterChart{
    width:100%;
    height:260px;
    display:block;
}

.chart-empty{
    text-align:center;
    color:#888;
    padding:60px 10px;
}

/* =========================
   FILTER
========================= */

.filter-card{
    background:#ffffff;
    border-radius:20px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 5px 20px rgba(0,0,0,0.06);
}

.filter-grid{
    display:grid;
    grid-template-columns:
        repeat(3, minmax(0,1fr));
    gap:12px;
}

/* =========================
   TABLE
========================= */

.table-card{
    background:#ffffff;
    border-radius:20px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 5px 20px rgba(0,0,0,0.06);
}

.table-wrapper{
    width:100%;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
}

table{
    width:100%;
    min-width:650px;
    border-collapse:collapse;
}

th,
td{
    padding:12px 10px;
    border-bottom:1px solid #edf0f4;
    text-align:left;
    white-space:nowrap;
}

th{
    background:#f8f9fb;
    font-size:13px;
    color:#666;
}

td{
    font-size:14px;
}

.cc-value{
    font-size:17px;
    font-weight:800;
}

.action-group{
    display:flex;
    gap:7px;
}

.table-btn{
    border:0;
    border-radius:9px;
    padding:7px 11px;
    font-size:13px;
    font-weight:700;
}

.edit-btn{
    background:#eef1ff;
    color:#4353d8;
}

.delete-btn{
    background:#fff0f0;
    color:#d33;
}

/* =========================
   FOOTER
========================= */

.footer{
    text-align:center;
    color:#999;
    font-size:12px;
    padding:15px 0 30px;
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.45);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:9999;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:420px;
    background:#fff;
    border-radius:20px;
    padding:22px;
}

.modal-title{
    font-size:20px;
    font-weight:800;
    margin-bottom:10px;
}

.modal-text{
    line-height:1.6;
    color:#555;
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:9px;
    margin-top:18px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:850px){

    .dashboard{
        grid-template-columns:
            repeat(2, minmax(0,1fr));
    }

    .form-grid{
        grid-template-columns:
            repeat(2, minmax(0,1fr));
    }

}

@media(max-width:600px){

    .container{
        padding:12px;
    }

    .header{
        padding:17px;
        border-radius:18px;
    }

    h1{
        font-size:22px;
    }

    .pet-icon{
        width:48px;
        height:48px;
        font-size:26px;
    }

    .dashboard{
        grid-template-columns:
            repeat(2, minmax(0,1fr));
        gap:9px;
    }

    .card{
        padding:14px;
        border-radius:15px;
    }

    .stat-value{
        font-size:23px;
    }

    .form-card,
    .today-card,
    .analysis-card,
    .chart-card,
    .filter-card,
    .table-card{
        padding:15px;
        border-radius:17px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .today-grid{
        grid-template-columns:1fr;
    }

    .filter-grid{
        grid-template-columns:1fr;
    }

    .btn{
        flex:1;
        min-width:120px;
    }

}

</style>
</head>

<div class="container">

    <!-- =========================

            <div class="stat-value">

            <div class="stat-value">

   LUCKY PET WATER TRACKER
   HTML + CSS + JAVASCRIPT

const OLD_STORAGE_KEY =
    "petWaterRecordsV2";

   GLOBAL STATE
   ========================================================= */

let records = [];

let editingId = null;

let pendingDeleteId = null;


/* =========================================================
   DOM ELEMENTS
   ========================================================= */

const yearSelect =
    document.getElementById("year");

const recordDate =
    document.getElementById("recordDate");

const ccInput =
    document.getElementById("cc");

const dailyTargetInput =

const todayTarget =

const currentTime =

const deleteModal =
    document.getElementById("deleteModal");

const cancelDeleteBtn =
    document.getElementById("cancelDeleteBtn");

const confirmDeleteBtn =

/* =========================================================
   UTILITY FUNCTIONS
   ========================================================= */

function generateId(){

    return Date.now().toString()
        + "_"
        + Math.random()
            .toString(36)
            .substring(2,9);

}


function getTodayISO(){

    const now = new Date();

    const year =
        now.getFullYear();

    const month =
        String(now.getMonth() + 1)
            .padStart(2,"0");

    const day =
        String(now.getDate())
            .padStart(2,"0");

    return `${year}-${month}-${day}`;

}


function getROCYear(dateString){

    if(!dateString){
        return "";
    }

    const date =
        new Date(dateString + "T00:00:00");

    return date.getFullYear() - 1911;

}


function formatDate(dateString){

    if(!dateString){
        return "—";
    }

    const date =
        new Date(dateString + "T00:00:00");

    const year =
        date.getFullYear();

    const month =
        String(date.getMonth() + 1)
            .padStart(2,"0");

    const day =
        String(date.getDate())
            .padStart(2,"0");

    return `${year}/${month}/${day}`;

}


function getWeekday(dateString){

    if(!dateString){
        return "";
    }

    const date =
        new Date(dateString + "T00:00:00");

    const weekdays = [
        "星期日",
        "星期一",
        "星期二",
        "星期三",
        "星期四",
        "星期五",
        "星期六"
    ];

    return weekdays[
        date.getDay()
    ];

}


function formatDateTime(value){

    if(!value){
        return "—";
    }

    const date =
        new Date(value);

    if(Number.isNaN(date.getTime())){
        return "—";
    }

    const y =
        date.getFullYear();

    const m =
        String(date.getMonth()+1)
            .padStart(2,"0");

    const d =
        String(date.getDate())
            .padStart(2,"0");

    const h =
        String(date.getHours())
            .padStart(2,"0");

    const min =
        String(date.getMinutes())
            .padStart(2,"0");

    return `${y}/${m}/${d} ${h}:${min}`;

}


function numberValue(value){

    const n =
        Number(value);

    if(!Number.isFinite(n)){
        return 0;
    }

    return n;

}


function roundNumber(value){

    return Math.round(
        value * 10
    ) / 10;

}


/* =========================================================
   LOCAL STORAGE
   ========================================================= */

function loadRecords(){

    try{

        const saved =
            localStorage.getItem(
                STORAGE_KEY
            );

        if(saved){

            const parsed =
                JSON.parse(saved);

            if(Array.isArray(parsed)){

                records = parsed;

                return;

            }

        }


        const oldSaved =
            localStorage.getItem(
                OLD_STORAGE_KEY
            );

        if(oldSaved){

            const oldParsed =
                JSON.parse(oldSaved);

            if(Array.isArray(oldParsed)){

                records =
                    oldParsed.map(item => ({
                        id:
                            item.id ||
                            generateId(),

                        year:
                            item.year ||
                            "",

                        date:
                            item.date ||
                            "",

                        cc:
                            numberValue(
                                item.cc
                            ),

                        createdAt:
                            item.createdAt ||
                            new Date().toISOString()
                    }));

                saveRecords();

                return;

            }

        }

        records = [];

    }catch(error){

        console.error(
            "Load records failed:",
            error
        );

        records = [];

    }

}


function saveRecords(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(records)
    );

}

/* =========================================================
   SORT RECORDS
   ========================================================= */

function sortedRecords(){

    return [...records].sort(
        (a,b) => {

            const dateCompare =
                String(b.date || "")
                .localeCompare(
                    String(a.date || "")
                );

            if(dateCompare !== 0){

                return dateCompare;

            }

            return String(b.createdAt || "")
                .localeCompare(
                    String(a.createdAt || "")
                );

        }
    );

}


/* =========================================================
   FILTER RECORDS
   ========================================================= */

function getFilteredRecords(){

    const selectedYear =
        filterYear.value;

    const selectedMonth =
        filterMonth.value;


    return sortedRecords()
        .filter(record => {

            if(
                selectedYear &&
                String(record.year) !==
                String(selectedYear)
            ){

                return false;

            }


            if(selectedMonth){

                if(!record.date){

                    return false;

                }

                const month =
                    String(
                        new Date(
                            record.date +
                            "T00:00:00"
                        ).getMonth()+1
                    );

                if(
                    month !==
                    String(selectedMonth)
                ){

                    return false;

                }

            }


            return true;

        });

}

/* =========================================================

   ========================================================= */

function buildDailyMap(){

    const map =
        new Map();


    records.forEach(record => {

        if(!record.date){

            return;

        }


        const old =
            map.get(record.date) || 0;


        map.set(
            record.date,
            old +
            numberValue(record.cc)
        );

    });


    return map;

}

/* =========================================================
   GET LAST N DAYS
   ========================================================= */

function getLastNDays(numberOfDays){

    const result = [];

    const today =
        new Date();

    today.setHours(
        0,0,0,0
    );


    for(
        let i = numberOfDays - 1;
        i >= 0;
        i--
    ){

        const date =
            new Date(today);

        date.setDate(
            today.getDate() - i
        );


        const year =
            date.getFullYear();

        const month =
            String(
                date.getMonth()+1
            ).padStart(2,"0");

        const day =
            String(
                date.getDate()
            ).padStart(2,"0");


        const iso =
            `${year}-${month}-${day}`;


        result.push(iso);

    }


    return result;

}


/* =========================================================
   WEEK AVERAGE
   ========================================================= */

function calculateWeekAverage(){

    const days =
        getLastNDays(7);

    const map =
        buildDailyMap();


    let total = 0;

    let recordedDays = 0;


    days.forEach(date => {

        const value =
            map.get(date);


        if(
            value !== undefined
        ){

            total += value;

            recordedDays++;

        }

    });


    if(recordedDays === 0){

        return 0;

    }


    return roundNumber(
        total /
        recordedDays
    );

}


/* =========================================================
   MONTH AVERAGE
   ========================================================= */

function calculateMonthAverage(){

    const now =
        new Date();

    const year =
        now.getFullYear();

    const month =
        now.getMonth();


    const map =
        buildDailyMap();


    let total = 0;

    let days = 0;


    map.forEach(
        (value,date) => {

            const d =
                new Date(
                    date +
                    "T00:00:00"
                );


            if(
                d.getFullYear() === year &&
                d.getMonth() === month
            ){

                total += value;

                days++;

            }

        }
    );


    if(days === 0){

        return 0;

    }


    return roundNumber(
        total / days
    );

}


/* =========================================================
   MAX / MIN DAILY
   ========================================================= */

function calculateDailyExtremes(){

    const map =
        buildDailyMap();

    const values =
        Array.from(
            map.entries()
        );


    if(values.length === 0){

        return {
            max:null,
            min:null
        };

    }


    values.sort(
        (a,b) =>
            b[1] - a[1]
    );


    return {

        max:values[0],

        min:
            values[
                values.length - 1
            ]

    };

}

/* =========================================================
   ANALYSIS
   ========================================================= */

function renderAnalysis(){

    const map =
        buildDailyMap();


    const dates =
        Array.from(
            map.keys()
        ).sort();


    if(dates.length < 2){

        analysisMessage.textContent =
            "目前紀錄較少，至少累積幾天後，可以更準確觀察 Lucky 的喝水變化。";

        analysisList.innerHTML =
            "";

        return;

    }


    const values =
        dates.map(
            date =>
                map.get(date)
        );


    const latest =
        values[
            values.length - 1
        ];


    const previous =
        values[
            values.length - 2
        ];


    let change = 0;


    if(previous > 0){

        change =
            (latest - previous) /
            previous *
            100;

    }


    const average =
        values.reduce(
            (sum,value) =>
                sum + value,
            0
        ) /
        values.length;


    const recentDates =
        dates.slice(-3);


    const recentValues =
        recentDates.map(
            date =>
                map.get(date)
        );


    const recentAverage =
        recentValues.reduce(
            (sum,value) =>
                sum + value,
            0
        ) /
        recentValues.length;


    const list = [];


    list.push(
        `最近一筆單日喝水量約 ${roundNumber(latest)} CC。`
    );


    list.push(
        `目前有紀錄日期的平均喝水量約 ${roundNumber(average)} CC。`
    );


    if(previous > 0){

        if(change >= 20){

            list.push(
                `與前一天相比增加約 ${roundNumber(change)}%，可以繼續觀察是否為短期波動。`
            );

        }else if(change <= -20){

            list.push(
                `與前一天相比減少約 ${roundNumber(Math.abs(change))}%，建議持續記錄幾天觀察趨勢。`
            );

        }else{

            list.push(
                `與前一天相比變化約 ${roundNumber(change)}%，目前看起來沒有非常明顯的單日變化。`
            );

        }

    }


    if(
        recentAverage >
        average * 1.3
    ){

        list.push(
            "最近幾天的平均值明顯高於過去紀錄，可以留意是否有環境、飲食或活動量變化。"
        );

    }


    if(
        recentAverage <
        average * 0.7
    ){

        list.push(
            "最近幾天的平均值明顯低於過去紀錄，建議持續觀察並確認飲水紀錄是否完整。"
        );

    }


    list.push(
        "喝水量會受到體重、食物含水量、天氣、活動量等因素影響，單靠喝水紀錄不能判斷疾病。"
    );


    analysisMessage.textContent =
        "以下分析是依照 Lucky 自己過去的紀錄做趨勢比較，不代表醫療診斷。";


    analysisList.innerHTML =
        "";


    list.forEach(text => {

        const li =
            document.createElement("li");

        li.textContent =
            text;

        analysisList.appendChild(
            li
        );

    });

}


/* =========================================================
   CHART
   ========================================================= */

function renderChart(){

    const days =
        getLastNDays(30);

    const map =
        buildDailyMap();


    const values =
        days.map(
            date =>
                numberValue(
                    map.get(date)
                )
        );


    const hasData =
        values.some(
            value =>
                value > 0
        );


    waterChart.innerHTML =
        "";


    if(!hasData){

        chartEmpty.style.display =
            "block";

        return;

    }


    chartEmpty.style.display =
        "none";


    const width = 900;

    const height = 260;

    const paddingLeft = 45;

    const paddingRight = 15;

    const paddingTop = 20;

    const paddingBottom = 35;


    const chartWidth =
        width -
        paddingLeft -
        paddingRight;


    const chartHeight =
        height -
        paddingTop -
        paddingBottom;


    const maxValue =
        Math.max(
            ...values,
            1
        );


    const niceMax =
        Math.ceil(
            maxValue /
            100
        ) * 100;


    /* GRID */

    for(
        let i = 0;
        i <= 4;
        i++
    ){

        const y =
            paddingTop +
            chartHeight *
            i /
            4;


        const value =
            niceMax -
            niceMax *
            i /
            4;


        const line =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "line"
            );


        line.setAttribute(
            "x1",
            paddingLeft
        );

        line.setAttribute(
            "x2",
            width -
            paddingRight
        );

        line.setAttribute(
            "y1",
            y
        );

        line.setAttribute(
            "y2",
            y
        );

        line.setAttribute(
            "stroke",
            "#e8ebf1"
        );

        line.setAttribute(
            "stroke-width",
            "1"
        );


        waterChart.appendChild(
            line
        );


        const text =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "text"
            );


        text.setAttribute(
            "x",
            5
        );

        text.setAttribute(
            "y",
            y + 4
        );

        text.setAttribute(
            "font-size",
            "11"
        );

        text.setAttribute(
            "fill",
            "#888"
        );

        text.textContent =
            Math.round(value);


        waterChart.appendChild(
            text
        );

    }


    /* POLYLINE */

    const points =
        values.map(
            (value,index) => {

                const x =
                    paddingLeft +
                    chartWidth *
                    (
                        index /
                        (
                            values.length - 1
                        )
                    );


                const y =
                    paddingTop +
                    chartHeight *
                    (
                        1 -
                        value /
                        niceMax
                    );


                return `${x},${y}`;

            }
        ).join(" ");


    const polyline =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "polyline"
        );


    polyline.setAttribute(
        "points",
        points
    );

    polyline.setAttribute(
        "fill",
        "none"
    );

    polyline.setAttribute(
        "stroke",
        "#5c6cff"
    );

    polyline.setAttribute(
        "stroke-width",
        "4"
    );

    polyline.setAttribute(
        "stroke-linecap",
        "round"
    );

    polyline.setAttribute(
        "stroke-linejoin",
        "round"
    );


    waterChart.appendChild(
        polyline
    );


    /* POINTS */

    values.forEach(
        (value,index) => {

            if(value <= 0){

                return;

            }


            const x =
                paddingLeft +
                chartWidth *
                (
                    index /
                    (
                        values.length - 1
                    )
                );


            const y =
                paddingTop +
                chartHeight *
                (
                    1 -
                    value /
                    niceMax
                );


            const circle =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "circle"
                );


            circle.setAttribute(
                "cx",
                x
            );

            circle.setAttribute(
                "cy",
                y
            );

            circle.setAttribute(
                "r",
                "5"
            );

            circle.setAttribute(
                "fill",
                "#ffffff"
            );

            circle.setAttribute(
                "stroke",
                "#5c6cff"
            );

            circle.setAttribute(
                "stroke-width",
                "3"
            );


            waterChart.appendChild(
                circle
            );

        }
    );


    /* DATE LABELS */

    const labelIndexes = [
        0,
        7,
        14,
        21,
        29
    ];


    labelIndexes.forEach(index => {

        const date =
            days[index];


        const x =
            paddingLeft +
            chartWidth *
            (
                index /
                (
                    days.length - 1
                )
            );


        const text =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "text"
            );


        text.setAttribute(
            "x",
            x
        );

        text.setAttribute(
            "y",
            height - 8
        );

        text.setAttribute(
            "font-size",
            "11"
        );

        text.setAttribute(
            "text-anchor",
            "middle"
        );

        text.setAttribute(
            "fill",
            "#888"
        );


        text.textContent =
            date.slice(5);


        waterChart.appendChild(
            text
        );

    });

}


/* =========================================================
   RENDER ALL
   ========================================================= */

function renderAll(){

    renderDashboard();

    renderAnalysis();

    renderChart();

    renderTable();

}


/* =========================================================
   DAILY TARGET STORAGE
   ========================================================= */

const TARGET_KEY =
    "LUCKY_DAILY_WATER_TARGET";


function loadTarget(){

    const value =
        localStorage.getItem(
            TARGET_KEY
        );


    if(value){

        dailyTargetInput.value =
            value;

    }

}


function saveTarget(){

    const value =
        numberValue(
            dailyTargetInput.value
        );


    if(value > 0){

        localStorage.setItem(
            TARGET_KEY,
            String(value)
        );

    }else{

        localStorage.removeItem(
            TARGET_KEY
        );

    }


    renderDashboard();

}
